<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishra Hotel</title>
    <style>
        body { font-family: sans-serif; background-color: #fcf8f2; margin: 0; padding: 0; }
        header { background: white; padding: 15px; font-weight: bold; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-container { padding: 20px; }
        .menu-card { background: white; width: 100%; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .menu-card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; }
        .price { color: #d35400; font-weight: bold; font-size: 1.3rem; }
        .nav-links { padding: 20px; background: #fff; margin-top: 10px; border-radius: 10px; }
        .nav-links a { display: block; padding: 10px 0; text-decoration: none; color: #333; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <header>Mishra Hotel</header>

    <div class="nav-links">
        <a href="#menu">Menu</a>
        <a href="#about">About</a>
        <a href="#payment">Payment</a>
    </div>

    <div class="menu-container" id="menu">
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500" alt="Bada Pav">
            <div class="info">
                <h3>Classic Mumbai Bada Pav</h3>
                <p>Golden fried spiced potato vada with spicy garlic chutney.</p>
                <p class="price">₹20</p>
            </div>
        </div>

        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1625220194760-4966d585461c?w=500" alt="Momos">
            <div class="info">
                <h3>Steamed & Fried Momos</h3>
                <p>Juicy fillings served with signature hot dip.</p>
                <p class="price">₹60</p>
            </div>
        </div>
    </div>

    <div id="about" style="padding: 20px;">
        <h2>About Us</h2>
        <p>Mishra Hotel serves the most authentic street food in town.</p>
    </div>

    <div id="payment" style="padding: 20px; background: #fff;">
        <h2>Payment</h2>
        <p>Scan to pay via UPI.</p>
    </div>

</body>
</html>
