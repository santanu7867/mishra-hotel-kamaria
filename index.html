<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISHRA HOTEL - Street Food Delights</title>
    <style>
        /* Global Styles */
        body { margin: 0; padding: 0; font-family: sans-serif; color: #333; background-color: #fcf8f2; }
        
        /* Side Navigation */
        .sidenav {
            height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; left: 0;
            background-color: #2c3e50; overflow-x: hidden; transition: 0.5s; padding-top: 60px;
        }
        .sidenav a { padding: 15px 32px; text-decoration: none; font-size: 20px; color: #fff; display: block; }
        .closebtn { position: absolute; top: 0; right: 25px; font-size: 35px; cursor: pointer; }
        
        /* Header */
        header { padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; }
        
        /* Page specific designs */
        .hero { text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>

    <header>
        <span style="font-size: 30px; cursor: pointer;" onclick="openNav()">&#9776;</span>
        <span style="margin-left: 15px; font-weight: bold; font-size: 20px;">Mishra Hotel</span>
    </header>

    <div id="mySideNav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="payment.html">Payment</a>
        <a href="about.html">About</a>
    </div>

    <div class="hero">
        <h1>Welcome to Mishra Hotel</h1>
        <p>Authentic Street Food Delights</p>
    </div>

    <script>
        function openNav() {
            document.getElementById("mySideNav").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySideNav").style.width = "0";
        }
    </script>
</body>
</html>
