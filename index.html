<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishra Hotel</title>
    <style>
        body { font-family: sans-serif; background-color: #fcf8f2; margin: 0; padding: 0; }
        header { background: white; padding: 15px; font-weight: bold; font-size: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .menu-card { background: white; width: 300px; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .menu-card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; }
        .price { color: #d35400; font-weight: bold; font-size: 1.3rem; }
    </style>
</head>
<body>

    <header>Mishra Hotel</header>

    <div class="menu-container">
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500" alt="Bada Pav">
            <div class="info">
                <h3>Classic Mumbai Bada Pav</h3>
                <p>Golden fried spiced potato vada with spicy garlic chutney.</p>
                <p class="price">₹20</p>
            </div>
        </div>

        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1625220194760-4966d585461c?w=500" alt="Momos">
            <div class="info">
                <h3>Steamed & Fried Momos</h3>
                <p>Juicy fillings served with signature hot dip.</p>
                <p class="price">₹60</p>
            </div>
        </div>
    </div>

</body>
</html>
