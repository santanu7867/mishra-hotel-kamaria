<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISHRA HOTEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #fcf8f2; }
        .hero { height: 300px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=800') center/cover; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .menu-section { padding: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; }
        .price { color: #d35400; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>MISHRA HOTEL</h1>
        <p>The Ultimate Destination for Authentic Bada Pav & Momos</p>
    </div>

    <div class="menu-section">
        <h2>Our Specialties</h2>
        
        <div class="card">
            <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500" alt="Bada Pav">
            <div class="info">
                <h3>Classic Mumbai Bada Pav</h3>
                <p>Golden fried spiced potato vada with spicy garlic chutney.</p>
                <p class="price">₹20</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1625220194760-4966d585461c?w=500" alt="Momos">
            <div class="info">
                <h3>Steamed & Fried Momos</h3>
                <p>Juicy fillings served with signature hot dip.</p>
                <p class="price">₹60</p>
            </div>
        </div>
    </div>

</body>
</html>
