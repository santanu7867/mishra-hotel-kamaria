<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mishra Hotel</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #fcf8f2; }
        header { padding: 15px; background: white; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sidenav { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; left: 0; background-color: #2c3e50; overflow-x: hidden; transition: 0.5s; padding-top: 60px; }
        .sidenav a { padding: 15px 32px; text-decoration: none; font-size: 20px; color: #fff; display: block; }
        .closebtn { position: absolute; top: 0; right: 25px; font-size: 35px; cursor: pointer; color: white; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=800') no-repeat center center/cover; height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .menu-section { padding: 20px; max-width: 600px; margin: auto; }
        .menu-card { background: white; border-radius: 10px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-card img { width: 100%; height: 200px; object-fit: cover; }
        .menu-info { padding: 15px; }
        .price { color: #d35400; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <span style="font-size: 30px; cursor: pointer;" onclick="document.getElementById('mySideNav').style.width='250px'">☰</span>
        <span style="margin-left: 15px; font-weight: bold;">Mishra Hotel</span>
    </header>

    <div id="mySideNav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="document.getElementById('mySideNav').style.width='0'">&times;</a>
        <a href="#">Home</a>
        <a href="#">Menu</a>
    </div>

    <div class="hero">
        <h1>MISHRA HOTEL</h1>
        <p>Authentic Bada Pav & Steaming Momos</p>
    </div>

    <div class="menu-section">
        <h2>Our Specialties</h2>
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500" alt="Bada Pav">
            <div class="menu-info">
                <h3>Classic Mumbai Bada Pav</h3>
                <p>Golden fried spiced potato vada with spicy garlic chutney.</p>
                <p class="price">₹20</p>
            </div>
        </div>
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1625220194760-4966d585461c?w=500" alt="Momos">
            <div class="menu-info">
                <h3>Steamed & Fried Momos</h3>
                <p>Juicy fillings served with signature hot dip.</p>
                <p class="price">₹60</p>
            </div>
        </div>
    </div>

</body>
</html>
